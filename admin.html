<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kovai Cakes | Admin Upload Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-warm: #FAF6F0;
      --bg-card: #FFFFFF;
      --text-dark: #221715;
      --text-muted: #6B5E57;
      --primary-brown: #3D2314;
      --btn-brown: #075E54;
      --btn-brown-hover: #054840;
      --border-light: #E6DCD1;
    }
    body {
      background-color: var(--bg-warm);
      color: var(--text-dark);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .admin-card {
      background: var(--bg-card);
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(61, 35, 20, 0.08);
      max-width: 450px;
      width: 100%;
      border: 1px solid var(--border-light);
      text-align: center;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--primary-brown);
      margin-bottom: 8px;
      font-size: 26px;
    }
    p {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .btn {
      background-color: var(--btn-brown);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover {
      background-color: var(--btn-brown-hover);
    }
    .hidden {
      display: none !important;
    }
    input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px dashed var(--border-light);
      border-radius: 10px;
      margin-bottom: 20px;
      background: var(--bg-warm);
      cursor: pointer;
    }
    #status {
      margin-top: 15px;
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="admin-card">
    <h1>Admin Upload Portal</h1>
    
    <!-- Login View -->
    <div id="loginSection">
      <p>Please log in with your authorized owner account to upload photos to the live gallery.</p>
      <button class="btn" id="loginBtn">🔐 Login with Google / GitHub</button>
    </div>

    <!-- Upload View (Hidden until logged in) -->
    <div id="uploadSection" class="hidden">
      <p>Select a cake photo to publish instantly to your website gallery.</p>
      <input type="file" id="cakeFile" accept="image/*">
      <button class="btn" id="uploadBtn">Upload to Live Website</button>
      <div id="status"></div>
      <br>
      <button class="btn" id="logoutBtn" style="background-color: #8C4A4D; margin-top: 10px;">Log Out</button>
    </div>
  </div>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://eixrdmbtxitggosgrwpy.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpeHJkbWJ0eGl0Z2dvc2dyd3B5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTE4NjMsImV4cCI6MjEwNDI2Nzg2M30._pdp2hDX10uWbret3SAZOEOOxopkCI__5GQChFgt37E';

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginSection = document.getElementById('loginSection');
    const uploadSection = document.getElementById('uploadSection');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const uploadBtn = document.getElementById('uploadBtn');
    const cakeFile = document.getElementById('cakeFile');
    const statusDiv = document.getElementById('status');

    // Check auth state on load
    async function checkUser() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        loginSection.classList.add('hidden');
        uploadSection.classList.remove('hidden');
      } else {
        loginSection.classList.remove('hidden');
        uploadSection.classList.add('hidden');
      }
    }

    checkUser();

    // Login handler
    loginBtn.addEventListener('click', async () => {
      const { error } = await supabaseClient.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.href
        }
      });
      if (error) alert(error.message);
    });

    // Logout handler
    logoutBtn.addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      checkUser();
    });

    // Upload handler
    uploadBtn.addEventListener('click', async () => {
      const file = cakeFile.files[0];
      if (!file) {
        statusDiv.style.color = '#8C4A4D';
        statusDiv.textContent = 'Please select an image file first!';
        return;
      }

      statusDiv.style.color = 'var(--text-muted)';
      statusDiv.textContent = 'Uploading photo...';

      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}.${fileExt}`;
      const filePath = `${fileName}`;

      // 1. Upload image to Supabase Storage Bucket ('cake-gallery')
      const { error: uploadError } = await supabaseClient.storage
        .from('cake-gallery')
        .upload(filePath, file);

      if (uploadError) {
        statusDiv.style.color = '#8C4A4D';
        statusDiv.textContent = 'Upload failed: ' + uploadError.message;
        return;
      }

      // 2. Get Public URL of the uploaded image
      const { data: publicUrlData } = supabaseClient.storage
        .from('cake-gallery')
        .getPublicUrl(filePath);

      const imageUrl = publicUrlData.publicUrl;

      // 3. Save the image URL record into the 'gallery' table
      const { error: dbError } = await supabaseClient
        .from('gallery')
        .insert([{ image_url: imageUrl }]);

      if (dbError) {
        statusDiv.style.color = '#8C4A4D';
        statusDiv.textContent = 'Database error: ' + dbError.message;
        return;
      }

      statusDiv.style.color = '#075E54';
      statusDiv.textContent = 'Success! Photo published to your website gallery.';
      cakeFile.value = '';
    });
  </script>
</body>
</html>
