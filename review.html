<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Reviews | Kovai Cakes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-warm: #FAF6F0;
      --bg-card: #FFFFFF;
      --text-dark: #221715;
      --text-muted: #6B5E57;
      --primary-brown: #3D2314;
      --gold-accent: #D4AF37;
      --gold-light: #FDF8EC;
      --border-light: #E6DCD1;
      --shadow-subtle: 0 10px 30px rgba(61, 35, 20, 0.05);
      --transition-smooth: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body {
      background-color: var(--bg-warm);
      color: var(--text-dark);
      font-family: 'Plus Jakarta Sans', sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px 60px 20px;
      line-height: 1.6;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 50px;
      color: var(--primary-brown);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(61, 35, 20, 0.03);
      transition: var(--transition-smooth);
    }

    .back-btn:hover {
      background-color: var(--primary-brown);
      color: #FFFFFF;
      border-color: var(--primary-brown);
      transform: translateY(-2px);
    }

    .back-arrow {
      font-size: 16px;
      line-height: 1;
    }

    .header-container {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--primary-brown);
      font-size: 38px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 16px;
      max-width: 500px;
      margin: 0 auto;
    }

    .rating-summary-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--gold-light);
      border: 1px solid rgba(212, 175, 55, 0.3);
      padding: 8px 16px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-brown);
      margin-bottom: 25px;
    }

    #reviewsContainer {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .review-card {
      background: var(--bg-card);
      padding: 28px;
      border-radius: 20px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-subtle);
      transition: var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }

    .review-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px rgba(61, 35, 20, 0.08);
      border-color: rgba(212, 175, 55, 0.4);
    }

    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .reviewer-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .reviewer-name {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--primary-brown);
      font-size: 19px;
    }

    .verified-badge {
      font-size: 11px;
      color: #075E54;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .stars {
      color: var(--gold-accent);
      font-size: 15px;
      letter-spacing: 3px;
    }

    .review-comment {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.7;
      margin: 0;
    }

    .loading-state, .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 50px 20px;
      background: var(--bg-card);
      border-radius: 20px;
      border: 1px solid var(--border-light);
      font-size: 15px;
    }

    /* Subtle quote watermark design for cards */
    .review-card::before {
      content: "“";
      position: absolute;
      right: 20px;
      bottom: 5px;
      font-size: 90px;
      font-family: 'Playfair Display', serif;
      color: rgba(61, 35, 20, 0.03);
      line-height: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="back-btn">
      <span class="back-arrow">←</span>
      <span>Back to Home</span>
    </a>
  </div>

  <div class="header-container">
    <h1>What Our Customers Say</h1>
    <p class="subtitle">Real feedback and heartfelt reviews from people who love our cakes.</p>
  </div>

  <div style="text-align: center;">
    <div id="summaryBadge" class="rating-summary-badge" style="display: none;">
      ⭐ Loved by our sweet customers
    </div>
  </div>

  <div id="reviewsContainer">
    <div class="loading-state">Loading customer reviews...</div>
  </div>

  <!-- Include Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Initialize Supabase client
    const supabaseClient = window.supabase.createClient(
      'https://eixrdmbtxitggosgrwpy.supabase.co', 
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpeHJkbWJ0eGl0Z2dvc2dyd3B5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTE4NjMsImV4cCI6MjEwNDI2Nzg2M30._pdp2hDX10uWbret3SAZOEOOxopkCI__5GQChFgt37E'
    );

    async function loadAllReviews() {
      const container = document.getElementById('reviewsContainer');
      const summaryBadge = document.getElementById('summaryBadge');
      
      const { data, error } = await supabaseClient
        .from('reviews')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = '<div class="empty-state" style="color: #8C4A4D;">Failed to load reviews. Please try again later.</div>';
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = '<div class="empty-state">No reviews yet. Be the first to share your experience on the home page!</div>';
        return;
      }

      // Show and update summary badge count
      summaryBadge.style.display = 'inline-flex';
      summaryBadge.innerHTML = `⭐ Rated 5/5 Average from ${data.length} Verified Customer Reviews`;

      container.innerHTML = '';
      data.forEach(item => {
        const starString = '★'.repeat(item.rating) + '☆'.repeat(5 - item.rating);
        
        const card = document.createElement('div');
        card.className = 'review-card';
        card.innerHTML = `
          <div class="review-header">
            <div class="reviewer-info">
              <span class="reviewer-name">${escapeHtml(item.name)}</span>
              <span class="verified-badge">✓ Verified Customer</span>
            </div>
            <span class="stars">${starString}</span>
          </div>
          <p class="review-comment">${escapeHtml(item.comment)}</p>
        `;
        container.appendChild(card);
      });
    }

    // Security helper to escape HTML and prevent text injections
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadAllReviews();
  </script>
</body>
</html>
