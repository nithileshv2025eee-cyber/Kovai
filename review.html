<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Reviews | Kovai Cakes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-warm: #FAF6F0;
      --bg-card: #FFFFFF;
      --text-dark: #221715;
      --text-muted: #6B5E57;
      --primary-brown: #3D2314;
      --gold-accent: #C5A059;
      --border-light: #E6DCD1;
    }

    body {
      background-color: var(--bg-warm);
      color: var(--text-dark);
      font-family: 'Plus Jakarta Sans', sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      line-height: 1.6;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      color: var(--primary-brown);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      box-shadow: 0 4px 12px rgba(61, 35, 20, 0.03);
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      background-color: var(--primary-brown);
      color: #FFFFFF;
      border-color: var(--primary-brown);
      transform: translateY(-1px);
    }

    .back-arrow {
      font-size: 16px;
      line-height: 1;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: var(--primary-brown);
      text-align: center;
      font-size: 36px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 40px;
    }

    #reviewsContainer {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .review-card {
      background: var(--bg-card);
      padding: 24px;
      border-radius: 20px;
      border: 1px solid var(--border-light);
      box-shadow: 0 10px 30px rgba(61, 35, 20, 0.04);
    }

    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .reviewer-name {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      color: var(--primary-brown);
      font-size: 18px;
    }

    .stars {
      color: var(--gold-accent);
      font-size: 16px;
      letter-spacing: 2px;
    }

    .review-comment {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .loading-state, .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 0;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="back-btn">
      <span>Back</span>
      <span class="back-arrow">←</span>
    </a>
  </div>

  <h1>What Our Customers Say</h1>
  <p class="subtitle">Real feedback and heartfelt reviews from people who love our cakes.</p>

  <div id="reviewsContainer">
    <div class="loading-state">Loading customer reviews...</div>
  </div>

  <!-- Include Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Initialize Supabase client
    const supabaseClient = window.supabase.createClient(
      'https://eixrdmbtxitggosgrwpy.supabase.co', 
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpeHJkbWJ0eGl0Z2dvc2dyd3B5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTE4NjMsImV4cCI6MjEwNDI2Nzg2M30._pdp2hDX10uWbret3SAZOEOOxopkCI__5GQChFgt37E'
    );

    async function loadAllReviews() {
      const container = document.getElementById('reviewsContainer');
      
      const { data, error } = await supabaseClient
        .from('reviews')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = '<div class="empty-state" style="color: #8C4A4D;">Failed to load reviews. Please try again later.</div>';
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = '<div class="empty-state">No reviews yet. Be the first to share your experience on the home page!</div>';
        return;
      }

      container.innerHTML = '';
      data.forEach(item => {
        const starString = '★'.repeat(item.rating) + '☆'.repeat(5 - item.rating);
        
        const card = document.createElement('div');
        card.className = 'review-card';
        card.innerHTML = `
          <div class="review-header">
            <span class="reviewer-name">${escapeHtml(item.name)}</span>
            <span class="stars">${starString}</span>
          </div>
          <p class="review-comment">${escapeHtml(item.comment)}</p>
        `;
        container.appendChild(card);
      });
    }

    // Security helper to escape HTML and prevent text injections
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadAllReviews();
  </script>
</body>
</html>
